# Builds CleanCalendar for Windows (x64 and ARM64) and macOS (a universal
# .app), and attaches the builds to the GitHub release of the pushed tag
# (creating the release if it doesn't exist yet).
#
# Pull requests and manual runs build too, and keep the results as workflow
# artifacts instead of publishing them, so a broken build shows up before
# tagging.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev libxkbcommon-dev libgl1-mesa-dev
      - run: cargo test --locked

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/CleanCalendar.exe dist/CleanCalendar-windows-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle CleanCalendar.app
        run: |
          # The version: the tag without its "v", or Cargo's for untagged builds.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          fi

          app=dist/CleanCalendar.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/CleanCalendar" \
            target/aarch64-apple-darwin/release/CleanCalendar \
            target/x86_64-apple-darwin/release/CleanCalendar

          # The icon: the largest image in the Windows .ico, scaled to every
          # size an .icns holds.
          sips -s format png assets/CleanCalendar.ico --out icon.png
          mkdir CleanCalendar.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size icon.png --out CleanCalendar.iconset/icon_${size}x${size}.png
            sips -z $((size * 2)) $((size * 2)) icon.png --out CleanCalendar.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns CleanCalendar.iconset -o "$app/Contents/Resources/CleanCalendar.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CleanCalendar</string>
            <key>CFBundleDisplayName</key><string>CleanCalendar</string>
            <key>CFBundleIdentifier</key><string>com.CleanCalendar.CleanCalendar</string>
            <key>CFBundleExecutable</key><string>CleanCalendar</string>
            <key>CFBundleIconFile</key><string>CleanCalendar</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"

          # Not notarized (that needs an Apple Developer ID): ad-hoc signing
          # only, which Apple Silicon requires for the app to start at all.
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"

          ditto -c -k --keepParent "$app" dist/CleanCalendar-macos.zip
          rm -rf "$app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/*

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
