[package]
name = "clean-calendar"
version = "0.1.0"
edition = "2021"
description = "An Apple Calendar–style desktop calendar with Google Calendar sync"

[dependencies]
eframe = "0.29"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
directories = "5"
uuid = { version = "1", features = ["v4"] }
url = "2"
open = "5"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
ab_glyph = "0.2"
raw-window-handle = "0.6"
rusqlite = { version = "0.42.0", features = ["bundled", "chrono"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
rrule = "0.14"
quick-xml = "0.37"
osmpbf = { version = "0.3.8", optional = true }
zstd = "0.14.4"
fst = "0.4.7"
rayon = { version = "1.12.0", optional = true }

[features]
# The `--build-places` command that turns OpenStreetMap extracts into the
# location indexes published with a release (see README). Not in the app.
build-places = ["dep:osmpbf", "dep:rayon"]

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Console"] }

[profile.dev.package."*"]
opt-level = 2
