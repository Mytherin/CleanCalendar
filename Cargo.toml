[package]
name = "clean-calendar"
version = "0.1.0"
edition = "2021"
description = "An Apple Calendar–style desktop calendar with Google Calendar sync"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["datepicker"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
directories = "5"
uuid = { version = "1", features = ["v4"] }
url = "2"
open = "5"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
ab_glyph = "0.2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[profile.dev.package."*"]
opt-level = 2
